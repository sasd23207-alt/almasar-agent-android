name: Build AlmasarPOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - upload-original-pos-and-build
    paths:
      - "AlmasarPOS/**"
      - ".github/workflows/almasarpos-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: AlmasarPOS
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlmasarPOS-debug-apk
          path: AlmasarPOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
