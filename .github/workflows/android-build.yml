name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, local-phone-bot]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run local message contract tests
        run: node --test tests/*.test.cjs
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          [ ! -f bridge-client.js ] || cp bridge-client.js www/
          cp local-message-envelope.js www/
          cp local-message-inbox.js www/
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest www/
          [ ! -f sw.js ] || cp sw.js www/
          [ ! -f icon-192.png ] || cp icon-192.png www/
          [ ! -f icon-512.png ] || cp icon-512.png www/
          cat > package.json <<'EOF'
          {
            "name": "almasar-agent-android",
            "version": "1.0.0",
            "private": true,
            "description": "Android package for Almasar agent app",
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ly.almasar.agent.localbot",
            "appName": "المسار - الوكيل المحلي",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
      - name: Install Capacitor and generate Android project
        run: |
          npm install
          npx cap add android
      - name: Enable native WhatsApp share target
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest has no application element")
          activity = next((node for node in app.findall("activity")
                           if node.get(android + "name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("Capacitor MainActivity not found in AndroidManifest")
          wanted = [(action, mime) for action in
                    ("android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE")
                    for mime in ("text/plain", "text/*", "application/octet-stream")]
          existing = set()
          for filt in activity.findall("intent-filter"):
              actions = {x.get(android + "name") for x in filt.findall("action")}
              types = {x.get(android + "mimeType") for x in filt.findall("data")}
              for action in actions:
                  for mime in types:
                      existing.add((action, mime))
          for action, mime in wanted:
              if (action, mime) in existing:
                  continue
              filt = ET.SubElement(activity, "intent-filter")
              ET.SubElement(filt, "action", {android + "name": action})
              ET.SubElement(filt, "category", {android + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(filt, "data", {android + "mimeType": mime})
          service_name = ".WhatsAppNotificationListenerService"
          service = next((node for node in app.findall("service")
                          if node.get(android + "name") == service_name), None)
          if service is None:
              service = ET.SubElement(app, "service")
          service.set(android + "name", service_name)
          service.set(android + "label", "المسار - استقبال واتساب بزنس")
          service.set(android + "permission", "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE")
          service.set(android + "exported", "true")
          if not any(
              action.get(android + "name") == "android.service.notification.NotificationListenerService"
              for filt in service.findall("intent-filter") for action in filt.findall("action")
          ):
              filt = ET.SubElement(service, "intent-filter")
              ET.SubElement(filt, "action", {android + "name": "android.service.notification.NotificationListenerService"})
          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          # Ensure Android's namespace prefix remains declared after XML serialization.
          manifest = open(path, encoding="utf-8").read()
          if "xmlns:android=" not in manifest:
              manifest = manifest.replace("<manifest", '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
              open(path, "w", encoding="utf-8").write(manifest)
          PY
          mkdir -p android/app/src/main/java/ly/almasar/agent/localbot
          cat > android/app/src/main/java/ly/almasar/agent/localbot/MainActivity.java <<'JAVA'
          package ly.almasar.agent.localbot;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.content.ComponentName;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends BridgeActivity {
              private static final String PREFS = "AlmasarNativeShare";
              private final ExecutorService shareReader = Executors.newSingleThreadExecutor();

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  attachShareBridge();
                  handleShareIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  attachShareBridge();
                  handleShareIntent(intent);
              }

              private void attachShareBridge() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new ShareBridge(), "AlmasarNative");
                  }
              }

              private void saveSharedText(String name, String text) {
                  if (text == null || text.trim().isEmpty()) return;
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                      .putString("name", name == null || name.trim().isEmpty() ? "محادثة واتساب" : name)
                      .putString("text", text)
                      .apply();
              }

              private void handleShareIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return;

                  String title = intent.getStringExtra(Intent.EXTRA_TITLE);
                  CharSequence shared = intent.getCharSequenceExtra(Intent.EXTRA_TEXT);
                  Uri stream = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (stream != null) {
                      final Uri fileUri = stream;
                      final String fileName = title != null ? title : fileUri.getLastPathSegment();
                      shareReader.execute(() -> {
                          try (InputStream in = getContentResolver().openInputStream(fileUri);
                               ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                              if (in == null) return;
                              byte[] buffer = new byte[8192];
                              int count;
                              while ((count = in.read(buffer)) != -1) {
                                  if (out.size() + count > 12 * 1024 * 1024) return;
                                  out.write(buffer, 0, count);
                              }
                              saveSharedText(fileName, new String(out.toByteArray(), StandardCharsets.UTF_8));
                          } catch (Exception ignored) {
                              if (shared != null) saveSharedText(title, shared.toString());
                          }
                      });
                  } else if (shared != null) {
                      saveSharedText(title, shared.toString());
                  }
              }

              private final class ShareBridge {
                  @JavascriptInterface
                  public String getPendingSharedText() {
                      return getSharedPreferences(PREFS, MODE_PRIVATE).getString("text", "");
                  }

                  @JavascriptInterface
                  public String getPendingSharedName() {
                      return getSharedPreferences(PREFS, MODE_PRIVATE).getString("name", "محادثة واتساب");
                  }

                  @JavascriptInterface
                  public void clearPendingShared() {
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit().remove("text").remove("name").apply();
                  }

                  @JavascriptInterface
                  public boolean hasWhatsAppNotificationAccess() {
                      String enabled = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      return enabled != null && enabled.contains(getPackageName() + "/");
                  }

                  @JavascriptInterface
                  public void openWhatsAppNotificationSettings() {
                      Intent settings = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                      settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(settings);
                  }

                  @JavascriptInterface
                  public String getPendingWhatsAppNotifications() {
                      return getSharedPreferences("AlmasarWhatsAppNotifications", MODE_PRIVATE)
                          .getString("events", "[]");
                  }

                  @JavascriptInterface
                  public void clearPendingWhatsAppNotifications() {
                      getSharedPreferences("AlmasarWhatsAppNotifications", MODE_PRIVATE)
                          .edit().putString("events", "[]").apply();
                  }

                  @JavascriptInterface
                  public void setRelayConfig(String json) {
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString("relay_config", json).apply();
                  }

                  @JavascriptInterface
                  public String getRelayConfig() {
                      return getSharedPreferences(PREFS, MODE_PRIVATE).getString("relay_config", "");
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/ly/almasar/agent/localbot/WhatsAppNotificationListenerService.java <<'JAVA'
          package ly.almasar.agent.localbot;

          import android.app.Notification;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          import android.text.TextUtils;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import android.content.SharedPreferences;

          /**
           * Captures only visible WhatsApp Business notification text.
           * Android grants notification access at device level; this service filters
           * strictly to the WhatsApp Business package before persisting anything.
           */
          public final class WhatsAppNotificationListenerService extends NotificationListenerService {
              private static final String WHATSAPP_BUSINESS_PACKAGE = "com.whatsapp.w4b";
              private static final String PREFS = "AlmasarWhatsAppNotifications";
              private static final String EVENTS = "events";
              private static final Object LOCK = new Object();
              private static final int MAX_EVENTS = 300;

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null || !WHATSAPP_BUSINESS_PACKAGE.equals(sbn.getPackageName())) return;
                  Notification notification = sbn.getNotification();
                  if (notification == null || notification.extras == null) return;
                  if ((notification.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;

                  Bundle extras = notification.extras;
                  CharSequence titleValue = extras.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence textValue = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  if (TextUtils.isEmpty(textValue)) textValue = extras.getCharSequence(Notification.EXTRA_TEXT);
                  if (TextUtils.isEmpty(textValue)) return;

                  String title = titleValue == null ? "واتساب بزنس" : titleValue.toString().trim();
                  String body = textValue.toString().trim();
                  if (body.isEmpty()) return;

                  long postedAt = sbn.getPostTime();
                  String eventId = sbn.getKey() + ":" + postedAt;
                  try {
                      synchronized (LOCK) {
                          SharedPreferences prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                          JSONArray current;
                          try { current = new JSONArray(prefs.getString(EVENTS, "[]")); }
                          catch (Exception ignored) { current = new JSONArray(); }
                          for (int i = 0; i < current.length(); i++) {
                              JSONObject old = current.optJSONObject(i);
                              if (old != null && eventId.equals(old.optString("id"))) return;
                          }
                          JSONObject event = new JSONObject();
                          event.put("id", eventId);
                          event.put("title", title);
                          event.put("text", body);
                          event.put("receivedAt", postedAt);
                          JSONArray next = new JSONArray();
                          int start = Math.max(0, current.length() - MAX_EVENTS + 1);
                          for (int i = start; i < current.length(); i++) next.put(current.getJSONObject(i));
                          next.put(event);
                          prefs.edit().putString(EVENTS, next.toString()).apply();
                      }
                  } catch (Exception ignored) {
                      // Never crash Android's notification pipeline because of local storage.
                  }
              }
          }
          JAVA
      - name: Set distinct local agent launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/masar_agent_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#102B3A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M22,25h64a8,8 0,0 1,8 8v38a8,8 0,0 1,-8 8h-24l-17,13v-13h-23a8,8 0,0 1,-8 -8v-38a8,8 0,0 1,8 -8z"/>
              <path android:fillColor="#FF0B6E4F" android:pathData="M34,43h40v6h-40zM34,56h25v6h-25z"/>
              <path android:fillColor="#FF0B6E4F" android:pathData="M67,60l7,7 14,-16 5,5 -19,22 -12,-12z"/>
          </vector>
          XML
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          p = "android/app/src/main/AndroidManifest.xml"
          a = "{http://schemas.android.com/apk/res/android}"
          t = ET.parse(p)
          app = t.getroot().find("application")
          if app is None:
              raise SystemExit("application element missing")
          app.set(a + "icon", "@drawable/masar_agent_icon")
          t.write(p, encoding="utf-8", xml_declaration=True)
          manifest = open(p, encoding="utf-8").read()
          if "xmlns:android=" not in manifest:
              manifest = manifest.replace("<manifest", '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
              open(p, "w", encoding="utf-8").write(manifest)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almasar-agent-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
