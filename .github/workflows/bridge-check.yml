name: WhatsApp Relay Checks
on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-check.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
