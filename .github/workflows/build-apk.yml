name: Build AlmasarPOS APK

on:
  push:
    branches:
      - upload-almasarpos-android
    paths:
      - 'source/AlmasarPOS-Android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract original project archive
        run: |
          test -f source/AlmasarPOS-Android.zip
          unzip -q source/AlmasarPOS-Android.zip -d .

      - name: Build debug APK
        run: gradle -p AlmasarPOS assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlmasarPOS-debug-apk
          path: AlmasarPOS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
